# nginx alternative to the Caddyfile. Put this in
# /etc/nginx/sites-available/openicq and link it into sites-enabled, then run
# `certbot --nginx -d icq.example.com` to fill in the certificate paths.

upstream openicq {
    server 127.0.0.1:5190;
    keepalive 32;
}

# Allow a browser a handful of connections, as a second line behind the
# server's own per-IP cap.
limit_conn_zone $binary_remote_addr zone=openicq_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name icq.example.com;

    # Everything except the ACME challenge goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name icq.example.com;

    ssl_certificate     /etc/letsencrypt/live/icq.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icq.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    limit_conn openicq_conn 20;
    client_max_body_size 64k;

    access_log /var/log/nginx/openicq.access.log;
    error_log  /var/log/nginx/openicq.error.log;

    # The WebSocket endpoint needs the upgrade dance and a long read timeout,
    # otherwise idle chat sessions get cut every minute.
    location /ws {
        proxy_pass http://openicq;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://openicq;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
