<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>OpenICQ</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/icq.css" />
  </head>
  <body>
    <div id="desktop">
      <div id="windows"></div>

      <!-- Sign-on -->
      <div id="signon" class="window signon-window">
        <div class="title-bar">
          <span class="title-icon" data-flower="online"></span>
          <span class="title-text">OpenICQ &mdash; Sign On</span>
        </div>
        <div class="window-body signon-body">
          <div class="signon-banner">
            <span class="big-flower" data-flower="online"></span>
            <div>
              <h1>OpenICQ</h1>
              <p class="tagline">Uh-oh! Someone still uses this.</p>
            </div>
          </div>

          <div id="signon-motd" class="motd" hidden></div>
          <div id="signon-update" class="motd update-note" hidden></div>

          <form id="signon-form" autocomplete="on">
            <label for="signon-uin">UIN or Nickname</label>
            <input id="signon-uin" name="username" class="field" autocomplete="username" required />

            <label for="signon-password">Password</label>
            <input
              id="signon-password"
              name="password"
              class="field"
              type="password"
              autocomplete="current-password"
              required
            />

            <label for="signon-status">Sign on as</label>
            <select id="signon-status" class="field"></select>

            <label class="check">
              <input type="checkbox" id="signon-remember" checked />
              <span>Remember my UIN</span>
            </label>

            <div id="signon-error" class="error-text" role="alert"></div>

            <div class="button-row">
              <button type="submit" class="btn default" id="signon-submit">Sign On</button>
              <button type="button" class="btn" id="signon-register">New UIN&hellip;</button>
            </div>
          </form>

          <div class="signon-footer">
            <span id="server-stats">connecting&hellip;</span>
            <span id="connection-dot" class="conn-dot" title="Connecting"></span>
          </div>
        </div>
      </div>
    </div>

    <div id="taskbar">
      <button id="start-button" class="task-start" type="button">
        <span data-flower="online"></span>
        <span>OpenICQ</span>
      </button>
      <div id="task-buttons"></div>
      <div id="tray">
        <span id="tray-flower" data-flower="offline" title="Offline"></span>
        <span id="clock">--:--</span>
      </div>
    </div>

    <div id="context-menu" class="menu" hidden></div>

    <script src="js/icons.js"></script>
    <script src="js/sounds.js"></script>
    <script src="js/win.js"></script>
    <script src="js/net.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
